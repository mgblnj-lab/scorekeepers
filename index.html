<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGBL Scorekeeper Sign-up</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1b1f2a; --muted:#6b7280; --line:#e3e6ec;
          --accent:#1f3864; --open:#1a7f37; --full:#9ca3af; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:#fff; color:var(--ink); padding:18px 16px 14px; text-align:center; border-bottom:4px solid #f47b20; }
  header img { display:block; width:120px; height:auto; margin:0 auto 8px; }
  header h1 { margin:0; font-size:22px; color:var(--accent); }
  header p { margin:6px 0 0; color:var(--muted); font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px;
          font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 8px; }
  .game { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px;
          margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .game.full { opacity:.6; }
  .info { flex:1; min-width:0; }
  .time { font-weight:700; }
  .match { margin:3px 0; }
  .meta { font-size:13px; color:var(--muted); }
  .slots { font-size:13px; margin-top:6px; }
  .slots .open { color:var(--open); font-weight:600; }
  .slots .names { color:var(--muted); }
  button.claim { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px;
                 font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  button.claim:disabled { background:var(--full); cursor:default; }
  .empty, .loading { text-align:center; color:var(--muted); padding:40px 0; }
  dialog { border:0; border-radius:12px; padding:0; width:min(420px, calc(100% - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  form { padding:20px; }
  form h3 { margin:0 0 4px; font-size:17px; }
  form .sub { font-size:13px; color:var(--muted); margin-bottom:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .ghost { background:none; border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer; }
  .msg { font-size:14px; margin-top:10px; }
  .msg.err { color:var(--err); }
  .cancel-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:8px; }
  .cancel-card h3 { margin:0 0 10px; font-size:18px; }
  .cancel-card p { margin:6px 0; }
  .danger { background:var(--err) !important; }
  a.home { display:inline-block; margin-top:14px; color:var(--accent); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--open); color:#fff;
           padding:12px 18px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>
<body>

  <h1>MGBL Scorekeeper Sign-up</h1>
  <p id="range">Loading this week's games…</p>
</header>
<main>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="loading">Loading…</div></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3>Sign up to keep score</h3>
    <div class="sub" id="dlgGame"></div>
    <label for="name">Name of child who will be keeping score</label>
    <input id="name" autocomplete="off" required>
    <label for="email">Parent's email</label>
    <input id="email" type="email" autocomplete="email" required>
    <div class="msg" id="formMsg"></div>
    <div class="row">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button type="submit" class="claim" id="submit">Sign up</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbxXFAFBUmghuQ0yv1SjnAd23nryhAHQg0y9qi6breQXImxvjMsHL9tJhxx6kpI5BLxdqg/exec';
  function call(api, params) {
    const q = new URLSearchParams(Object.assign({ api: api, t: Date.now() }, params || {}));
    return fetch(API + '?' + q.toString()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  let data = null, division = 'All', current = null;
  const $ = id => document.getElementById(id);

  function fmtDate(iso, opts) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', opts);
  }

  function load() {
    call('week').then(res => { data = res; render(); })
      .catch(() => { if (!data) $('list').innerHTML = '<div class="empty">Could not load games. Please refresh.</div>'; });
  }

  function render() {
    const w = data.window;
    $('range').textContent = 'Games ' + fmtDate(w.start, {month:'short', day:'numeric'}) +
      ' – ' + fmtDate(w.end, {month:'short', day:'numeric'}) + '. Two scorekeepers per game.';

    const divs = ['All'].concat([...new Set(data.games.map(g => g.division))].sort());
    $('filters').innerHTML = '';
    if (divs.length > 2) divs.forEach(d => {
      const b = document.createElement('button');
      b.className = 'chip' + (d === division ? ' on' : '');
      b.textContent = d;
      b.onclick = () => { division = d; render(); };
      $('filters').appendChild(b);
    });

    const games = data.games.filter(g => division === 'All' || g.division === division);
    const list = $('list');
    list.innerHTML = '';
    if (!games.length) { list.innerHTML = '<div class="empty">No games scheduled this week.</div>'; return; }

    let lastDate = '';
    games.forEach(g => {
      if (g.date !== lastDate) {
        const h = document.createElement('h2');
        h.textContent = fmtDate(g.date, {weekday:'long', month:'long', day:'numeric'});
        list.appendChild(h);
        lastDate = g.date;
      }
      const open = g.slots - g.filled;
      const card = document.createElement('div');
      card.className = 'game' + (open <= 0 ? ' full' : '');
      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = '<div class="time"></div><div class="match"></div><div class="meta"></div><div class="slots"></div>';
      info.querySelector('.time').textContent = g.start + ' – ' + g.end;
      info.querySelector('.match').textContent = g.game;
      info.querySelector('.meta').textContent = g.division + ' · ' + g.location + ', ' + g.court;
      const s = info.querySelector('.slots');
      const o = document.createElement('span');
      o.className = open > 0 ? 'open' : '';
      o.textContent = open > 0 ? open + ' of ' + g.slots + ' spots open' : 'Full';
      s.appendChild(o);
      const btn = document.createElement('button');
      btn.className = 'claim';
      btn.textContent = open > 0 ? 'Sign up' : 'Full';
      btn.disabled = open <= 0;
      btn.onclick = () => openForm(g);
      card.appendChild(info);
      card.appendChild(btn);
      list.appendChild(card);
    });
  }

  function openForm(g) {
    current = g;
    $('dlgGame').textContent = fmtDate(g.date, {weekday:'short', month:'short', day:'numeric'}) +
      ' · ' + g.start + ' · ' + g.game + ' (' + g.location + ', ' + g.court + ')';
    $('formMsg').textContent = '';
    $('formMsg').className = 'msg';
    $('submit').disabled = false;
    $('dlg').showModal();
  }

  $('cancel').onclick = () => $('dlg').close();
  $('form').onsubmit = e => {
    e.preventDefault();
    $('submit').disabled = true;
    $('formMsg').className = 'msg';
    $('formMsg').textContent = 'Saving…';
    call('signup', { game: current.id, name: $('name').value, email: $('email').value }).then(res => {
      if (res.ok) {
        $('dlg').close();
        showToast(res.message + ' A confirmation email is on its way.');
      } else {
        $('formMsg').className = 'msg err';
        $('formMsg').textContent = res.message;
        $('submit').disabled = false;
      }
      load();
    }).catch(() => {
      $('formMsg').className = 'msg err';
      $('formMsg').textContent = 'Something went wrong. Please try again.';
      $('submit').disabled = false;
    });
  };

  function showToast(t) {
    $('toast').textContent = t;
    $('toast').style.display = 'block';
    setTimeout(() => $('toast').style.display = 'none', 3500);
  }

  function showCancel(token) {
    $('filters').style.display = 'none';
    $('range').textContent = 'Cancel a scorekeeping sign-up';
    call('lookup', { token: token }).then(info => {
      const list = $('list');
      list.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'cancel-card';
      if (!info.ok) {
        card.innerHTML = '<h3></h3>';
        card.querySelector('h3').textContent = info.message;
        list.appendChild(card);
        return;
      }
      card.innerHTML = '<h3>Cancel this sign-up?</h3><p class="time"></p><p class="match"></p><p class="meta"></p>' +
        '<div class="row" style="justify-content:flex-start"><button class="claim danger" id="doCancel">Yes, cancel it</button></div>' +
        '<div class="msg" id="cancelMsg"></div><a class="home" id="home">Keep it and go to the sign-up page</a>';
      card.querySelector('.time').textContent = info.name + ' \u00b7 ' + info.when;
      card.querySelector('.match').textContent = info.game;
      card.querySelector('.meta').textContent = info.where;
      card.querySelector('#home').href = info.home;
      list.appendChild(card);
      $('doCancel').onclick = () => {
        $('doCancel').disabled = true;
        $('cancelMsg').className = 'msg';
        $('cancelMsg').textContent = 'Cancelling\u2026';
        call('cancel', { token: token }).then(res => {
          $('cancelMsg').className = res.ok ? 'msg' : 'msg err';
          $('cancelMsg').textContent = res.message;
          if (res.ok) {
            $('doCancel').style.display = 'none';
            $('home').textContent = 'Sign up for a different game';
          } else {
            $('doCancel').disabled = false;
          }
        }).catch(() => {
          $('cancelMsg').className = 'msg err';
          $('cancelMsg').textContent = 'Something went wrong. Please try again.';
          $('doCancel').disabled = false;
        });
      };
    }).catch(() => {
      $('list').innerHTML = '<div class="empty">Could not load this sign-up. Please refresh.</div>';
    });
  }

  const token = new URLSearchParams(location.search).get('cancel');
  if (token) {
    showCancel(token);
  } else {
    load();
    setInterval(load, 60000);
  }
</script>
</body>
</html>
